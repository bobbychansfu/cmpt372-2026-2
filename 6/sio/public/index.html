<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            flex-shrink: 0;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        #messages p {
            font-size: 0.9rem;
            margin: 0.2rem 0;
            line-height: 1.2;
        }
        #number {
            flex-shrink: 0;
        }
        form {
            flex-shrink: 0;
        }
    </style>
    <title>Document</title>
</head>
<body class="container-fluid p-2" onload="myfunction()">
    <h1>Websocket</h1>
    
    <div id="messages"></div>

    <div class="small text-danger" id="number"></div>

    <form action="javascript:void(0)">
        <div class="input-group mb-3">
            <input type="text" id="message" class="form-control" placeholder="MESSAGE" required autofocus>
            <div onclick="sub()" class="input-group-text">
                <span class="btn">SEND</span>
            </div>
        </div>
        <span class="btn btn-outline-danger" id="discon">DISCONNECT</span>
    </form>
    <script src="js/socket.io.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
